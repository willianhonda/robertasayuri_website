<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDFA"/>
      <stop offset="1" stop-color="#F5D0CA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#C6D1A5" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#C6D1A5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Círculo logo -->
  <g transform="translate(900 315)">
    <circle r="160" fill="none" stroke="#8E4553" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="0" y="20" font-family="Georgia, serif" font-size="120" font-weight="500" font-style="italic" text-anchor="middle" fill="#8E4553">RS</text>
  </g>

  <!-- Texto -->
  <g transform="translate(100 250)">
    <text font-family="Georgia, serif" font-size="36" font-weight="400" fill="#8E4553" letter-spacing="6">DRA. ROBERTA SAYURI</text>
    <text y="90" font-family="Georgia, serif" font-size="78" font-weight="400" fill="#596254" font-style="italic">Cuidar da pele</text>
    <text y="170" font-family="Georgia, serif" font-size="78" font-weight="400" fill="#596254">é um <tspan font-style="italic" fill="#8E4553">gesto de saúde</tspan>.</text>
    <text y="260" font-family="Arial, sans-serif" font-size="26" fill="#596254">Médica · CRM-SP 213495 · Guaianases/SP</text>
  </g>
</svg>
